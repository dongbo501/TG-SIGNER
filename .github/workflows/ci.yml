name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -e './upstream/tg-signer[yaml]'
          python -m pip install pytest pytest-asyncio ruff==0.14.6
      - run: ruff check backend
      - run: python -m pytest -q backend/tests
      - run: python -m pytest -q upstream/tg-signer/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Verify interface behavior
        run: |
          npx playwright install --with-deps chromium
          python3 -m http.server 18999 --bind 127.0.0.1 --directory out > /tmp/tg-signer-static.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18999/ > /dev/null; then break; fi
            sleep 1
          done
          DASHBOARD_URL=http://127.0.0.1:18999 npm run test:e2e -- tests/task-pagination.spec.ts tests/modernization.spec.ts
